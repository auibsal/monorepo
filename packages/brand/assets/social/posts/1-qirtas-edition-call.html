<!doctype html><html><head><link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet"><meta charset="utf-8"><style>/* ============================================================
   SAL Design System v3 — built on the AUIB palette
   Crimson #9C213E · White #FFFFFF · Ink #273236 · Ubuntu
   v3 adds: the Key monogram, legal-document styles, role cards,
   org charts, form fields, document control, Ubuntu Mono accents
   ============================================================ */

















:root{
  --crimson:#9C213E; --crimson-700:#7E1A32; --crimson-100:#EBCBD3; --crimson-50:#F7ECEF;
  --ink:#273236; --ink-70:#4A5559; --ink-50:#6E777A; --ink-10:#E7EAEB; --line:#E3DEDF; --paper:#FAF7F5; --white:#fff;
  --sans:Ubuntu, Kufi, sans-serif; --ar:Kufi, Ubuntu, sans-serif; --mono:'Ubuntu Mono', Ubuntu, monospace;
}
@page{size:A4;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff}
body{font-family:var(--sans);color:var(--ink);font-size:10.3pt;line-height:1.5;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ar{font-family:var(--ar);direction:rtl;unicode-bidi:isolate}
.mono{font-family:var(--mono)}
.page{width:210mm;height:297mm;position:relative;overflow:hidden;page-break-after:always;break-after:page;padding:24mm 21mm 20mm 21mm;background:#fff}
.page:last-child{page-break-after:auto;break-after:auto}
.page.dark{background:var(--ink);color:#fff}
.page.crimson{background:var(--crimson);color:#fff}
.page.paper{background:var(--paper)}
.runner{position:absolute;top:12mm;right:14mm;font-size:8pt;color:var(--ink)}
.runner-l{position:absolute;top:12mm;left:21mm;font-size:8pt;color:var(--crimson);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.dark .runner,.crimson .runner,.crimson .runner-l,.dark .runner-l{color:#fff}
.folio{position:absolute;bottom:9mm;left:21mm;right:21mm;display:flex;justify-content:space-between;font-size:7.5pt;color:var(--ink-50)}
.folio .code{font-family:var(--mono);letter-spacing:.04em}
.dark .folio,.crimson .folio{color:rgba(255,255,255,.72)}

h1.display{font-weight:700;font-size:54pt;line-height:1.02;color:var(--crimson);letter-spacing:-.01em;margin-bottom:5mm}
h1.display.md{font-size:42pt}
h1.display.sm{font-size:32pt}
h1.display.xs{font-size:26pt;margin-bottom:3mm}
.dark h1.display,.crimson h1.display{color:#fff}
.lede{font-weight:300;font-size:17pt;line-height:1.32;color:var(--ink);margin-bottom:8mm}
.lede.sm{font-size:14pt;margin-bottom:6mm}
.lede.xs{font-size:12pt;margin-bottom:4mm}
.dark .lede,.crimson .lede{color:#fff}
h2{font-weight:700;font-size:18pt;line-height:1.15;color:var(--ink);margin:0 0 3mm}
h2.c{color:var(--crimson)}
h3{font-weight:700;font-size:11.5pt;color:var(--ink);margin:0 0 1.4mm;line-height:1.25}
h3.c{color:var(--crimson)}
h4{font-weight:700;font-size:10pt;margin:0 0 1mm}
.dark h2,.dark h3,.crimson h2,.crimson h3{color:#fff}
p{margin:0 0 2.4mm}
.small{font-size:8.4pt;color:var(--ink-50);line-height:1.45}
.xs{font-size:7.8pt;line-height:1.4}
.dark .small,.crimson .small{color:rgba(255,255,255,.75)}
.muted{color:var(--ink-50)}
.intro{font-size:14pt;line-height:1.38;margin-bottom:8mm}
.big-p{font-size:12pt;line-height:1.5}
.kicker{font-size:7.8pt;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--crimson);margin-bottom:1.5mm}
.dark .kicker,.crimson .kicker{color:var(--crimson-100)}
hr.rule{border:0;border-top:1.5px solid var(--crimson);margin:4mm 0 6mm}
.dark hr.rule,.crimson hr.rule{border-top-color:#fff}
hr.thin{border:0;border-top:1px solid var(--line);margin:3mm 0}
b,strong{font-weight:700}

/* bands */
.band{position:absolute;left:0;right:0;bottom:0;background:var(--crimson);color:#fff;padding:8mm 21mm 10mm}
.band h2{color:#fff;font-weight:400;font-size:20pt;margin-bottom:2mm}
.band p{font-size:9.4pt;line-height:1.55;color:#fff;margin:0}
.band.ink{background:var(--ink)}
.band.flow{position:relative;margin:7mm -21mm 0}

/* cards */
.grid{display:grid;gap:4mm}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:#fff;color:var(--ink);border-radius:9px;padding:6mm 5.5mm}
.card h3{color:var(--crimson);font-size:12.5pt;margin:3mm 0 1.6mm}
.card p{font-size:9.1pt;line-height:1.5;margin:0}
.card.line{border:1px solid var(--crimson)}
.card.tint{background:var(--crimson-50)}
.card.grey{background:var(--ink-10)}
.card.cr{background:var(--crimson);color:#fff}
.card.cr h3{color:#fff;font-weight:400;font-size:14pt;margin-top:0}
.card.cr p{color:#fff}
.card.ink{background:var(--ink);color:#fff}
.card.ink h3{color:#fff}
.card.dashed{border:1.2px dashed var(--crimson);background:#fff}
.card.pad-s{padding:4mm 4.5mm}
.card.pad-s h3{margin-top:0}
.ic{width:11mm;height:11mm;border-radius:50%;background:var(--crimson-50);display:flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:5.6mm;height:5.6mm;stroke:var(--crimson);stroke-width:2.1}
.ic.w{background:rgba(255,255,255,.14)} .ic.w svg{stroke:#fff}

/* tables */
table.t{width:100%;border-collapse:collapse;font-size:9pt;line-height:1.42}
table.t th{text-align:left;font-size:7.6pt;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--crimson);padding:0 3mm 2mm 0;border-bottom:1.5px solid var(--crimson);vertical-align:bottom}
table.t td{padding:2.4mm 3mm 2.4mm 0;border-bottom:1px solid var(--line);vertical-align:top}
table.t td:first-child{font-weight:700}
table.t.plain td:first-child{font-weight:400}
table.t td.tbc,.tbc{font-style:italic;color:var(--ink-50)}
table.t.tight td{padding:1.6mm 2.5mm 1.6mm 0}
table.t.xs{font-size:8.1pt}
table.t.xs th{font-size:7pt}
table.t tr.hl td{background:var(--crimson-50)}
table.t td.c,table.t th.c{text-align:center}
.dark table.t td{border-bottom-color:rgba(255,255,255,.2)}
.dark table.t th{color:var(--crimson-100);border-bottom-color:var(--crimson-100)}
/* RACI marks */
.m{display:inline-block;min-width:5.2mm;height:5.2mm;line-height:5.2mm;border-radius:50%;text-align:center;font-size:7.2pt;font-weight:700}
.m.A{background:var(--crimson);color:#fff}.m.R{background:var(--crimson-100);color:var(--crimson-700)}.m.C{border:1px solid var(--ink-50);color:var(--ink-70)}.m.I{color:var(--ink-50)}

/* numbered list */
.nl .it{display:grid;grid-template-columns:15mm 1fr;padding:3.6mm 0;border-bottom:1px solid var(--crimson)}
.nl .it:last-child{border-bottom:0}
.nl .n{font-weight:700;font-size:21pt;color:var(--crimson);line-height:1}
.nl h3{font-size:11.5pt;margin-bottom:.8mm}
.nl p{font-size:9.2pt;margin:0;color:var(--ink-70)}
.nl.compact .it{padding:2.5mm 0}
.nl.compact .n{font-size:16pt}
.dark .nl .it{border-bottom-color:rgba(255,255,255,.3)} .dark .nl .n{color:var(--crimson-100)} .dark .nl p{color:rgba(255,255,255,.8)}

/* definition rows */
.dl .row{display:grid;grid-template-columns:55mm 1fr;gap:6mm;padding:3.2mm 0;align-items:start}
.dl .row h2{font-size:16pt;margin:0}
.dl .row p{margin:0;font-size:9.8pt}
.dl.tight .row{padding:2.1mm 0;grid-template-columns:44mm 1fr}
.dl.tight .row h2{font-size:12.5pt}
.dl.lined .row{border-bottom:1px solid var(--line)}

/* timeline */
.tl{position:relative}
.tl:before{content:"";position:absolute;left:5.6mm;top:3mm;bottom:2mm;width:1.4px;background:var(--crimson)}
.tl .ev{display:grid;grid-template-columns:13mm 38mm 1fr;gap:3mm;padding:2.4mm 3mm 2.4mm 0;position:relative;align-items:start}
.tl .dot{width:11.2mm;height:11.2mm;border-radius:50%;border:1.6px solid var(--crimson);background:#fff;position:relative;z-index:1;margin-top:-2mm}
.tl .ev.hl{background:var(--crimson-50);border-radius:7px;margin-left:-4mm;padding-left:4mm}
.tl .ev.hl .dot{background:var(--crimson)}
.tl .date{color:var(--crimson);font-weight:500;font-size:9pt}
.tl h3{font-size:11.5pt;margin-bottom:.5mm}
.tl p{font-size:8.9pt;color:var(--ink-70);margin:0;line-height:1.45}
.tl.sm .dot{width:8mm;height:8mm;margin-left:1.6mm;margin-top:-1mm}
.tl.sm .ev{padding:1.5mm 3mm 1.5mm 0}

/* stats */
.stats{display:grid;gap:5mm}
.stat .num{font-weight:700;font-size:32pt;line-height:1}
.stat .lab{font-size:9.2pt;margin-top:1.5mm}

.pill{display:inline-block;font-size:7.4pt;font-weight:500;padding:.5mm 2.3mm;border-radius:20px;background:var(--crimson-50);color:var(--crimson);margin:0 1mm 1mm 0;white-space:nowrap}
.pill.ink{background:var(--ink-10);color:var(--ink)}
.pill.solid{background:var(--crimson);color:#fff}
.pill.dk{background:var(--ink);color:#fff}

.note{border-left:3px solid var(--crimson);background:var(--crimson-50);padding:3.2mm 4.5mm;border-radius:0 6px 6px 0;font-size:9.1pt;margin:3mm 0}
.note b{color:var(--crimson)}
.note.ink{border-left-color:var(--ink);background:var(--ink-10)} .note.ink b{color:var(--ink)}
.box{border:1px solid var(--crimson);border-radius:8px;padding:5mm}

ul.b{list-style:none;margin:0 0 2mm}
ul.b li{position:relative;padding-left:5mm;margin-bottom:1.4mm;font-size:9.4pt}
ul.b li:before{content:"";position:absolute;left:0;top:2.1mm;width:1.7mm;height:1.7mm;background:var(--crimson)}
.dark ul.b li:before,.crimson ul.b li:before{background:#fff}
ul.b.sm li{font-size:8.7pt;margin-bottom:1mm}
ul.b.xs li{font-size:8pt;margin-bottom:.7mm;padding-left:4mm} ul.b.xs li:before{top:1.8mm;width:1.4mm;height:1.4mm}
ul.chk{list-style:none}
ul.chk li{position:relative;padding-left:7mm;margin-bottom:1.5mm;font-size:9.2pt}
ul.chk li:before{content:"";position:absolute;left:0;top:.9mm;width:3.5mm;height:3.5mm;border:1.2px solid var(--crimson);border-radius:1px}
ul.chk.sm li{font-size:8.5pt;margin-bottom:1.1mm}

/* ---------- v3: legal document (constitution, bylaws) ---------- */
.art{margin-bottom:5mm;break-inside:avoid}
.art .ah{display:flex;align-items:baseline;gap:4mm;border-bottom:1.5px solid var(--crimson);padding-bottom:1.6mm;margin-bottom:2.4mm}
.art .ah .no{font-family:var(--mono);font-weight:700;color:var(--crimson);font-size:10pt;letter-spacing:.06em;white-space:nowrap}
.art .ah h2{font-size:14.5pt;margin:0}
.cl{display:grid;grid-template-columns:11mm 1fr;gap:1mm;margin-bottom:1.6mm;font-size:9.3pt;line-height:1.5}
.cl .cn{font-family:var(--mono);color:var(--crimson);font-weight:700;font-size:9pt}
.cl.sub{grid-template-columns:11mm 7mm 1fr} .cl.sub .cn2{font-family:var(--mono);color:var(--ink-50);font-size:8.6pt}
.cl p{margin:0}
.legal-2{column-count:2;column-gap:8mm}
.legal-2 .art{break-inside:auto}
.legal-2 .cl{break-inside:avoid}

/* ---------- v3: org chart ---------- */
.org{display:flex;flex-direction:column;align-items:center;gap:0}
.orow{display:flex;justify-content:center;gap:4mm;width:100%}
.ob{border-radius:7px;padding:2.4mm 3mm;text-align:center;min-width:30mm;font-size:8.6pt;line-height:1.25}
.ob b{display:block;font-size:9.4pt}
.ob span{font-size:7.4pt;opacity:.85}
.ob.cr{background:var(--crimson);color:#fff}
.ob.ink{background:var(--ink);color:#fff}
.ob.tint{background:var(--crimson-50);color:var(--ink)}
.ob.ln{border:1.2px solid var(--crimson);background:#fff}
.ob.dash{border:1.2px dashed var(--ink-50);background:#fff;color:var(--ink-70)}
.vl{width:1.4px;height:5mm;background:var(--crimson)}
.hl-line{height:1.4px;background:var(--crimson)}

/* ---------- v3: role card ---------- */
.role{border-top:2px solid var(--crimson);padding-top:3mm;margin-bottom:5mm;break-inside:avoid}
.role .rh{display:flex;justify-content:space-between;align-items:baseline;gap:4mm}
.role .rh h2{font-size:15pt;margin:0;color:var(--crimson)}
.role .meta{display:flex;flex-wrap:wrap;gap:1mm 5mm;font-size:7.8pt;color:var(--ink-70);margin:1.4mm 0 2.4mm}
.role .meta b{color:var(--ink)}
.role .purpose{font-weight:300;font-size:11pt;line-height:1.38;margin-bottom:2.6mm}
.role .cols{display:grid;grid-template-columns:1.35fr 1fr;gap:6mm}

/* ---------- v3: forms ---------- */
.fhead{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--crimson);padding-bottom:3mm;margin-bottom:4mm}
.fhead .fcode{font-family:var(--mono);font-size:9pt;color:var(--crimson);font-weight:700}
.fhead h1{font-size:21pt;line-height:1.1;color:var(--ink);font-weight:700}
.fhead .fsub{font-size:8.6pt;color:var(--ink-50);margin-top:1mm}
.fl{margin-bottom:3.2mm}
.fl .lb{font-size:7.4pt;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--crimson);margin-bottom:1mm}
.fl .ln{border-bottom:1px solid var(--ink);height:7mm}
.fl .area{border:1px solid var(--ink-50);border-radius:3px}
.frow{display:grid;gap:5mm}
.f2{grid-template-columns:1fr 1fr}.f3{grid-template-columns:1fr 1fr 1fr}.f4{grid-template-columns:repeat(4,1fr)}
.cb{display:inline-flex;align-items:center;gap:1.6mm;margin-right:4.5mm;font-size:8.8pt;white-space:nowrap}
.cb:before{content:"";width:3.3mm;height:3.3mm;border:1.1px solid var(--crimson);border-radius:1px;display:inline-block}
table.grid-f{width:100%;border-collapse:collapse;font-size:8pt}
table.grid-f th{background:var(--crimson);color:#fff;font-weight:500;text-align:left;padding:1.6mm 2mm;font-size:7.4pt;letter-spacing:.04em}
table.grid-f td{border:1px solid var(--line);height:7.6mm;padding:1mm 2mm;vertical-align:top}
table.grid-f.tall td{height:9.5mm}
table.grid-f td.lab{background:var(--crimson-50);font-weight:700;width:34mm}
.sig{display:grid;gap:8mm;margin-top:6mm}
.sigline{border-top:1px solid var(--ink);padding-top:1.2mm;font-size:7.4pt;color:var(--ink-50)}
.letter{border:1px solid var(--line);border-radius:8px;padding:6mm 7mm;font-size:9.2pt;line-height:1.55;background:#fff}
.letter .subj{font-weight:700;color:var(--crimson);margin-bottom:2mm}
.letter p{margin-bottom:2mm}

/* document control block */
.dc{display:grid;grid-template-columns:repeat(4,1fr);border-top:1.5px solid var(--crimson);border-bottom:1px solid var(--line);font-size:7.8pt}
.dc div{padding:2mm 2.5mm 2mm 0}
.dc b{display:block;font-size:6.8pt;letter-spacing:.1em;text-transform:uppercase;color:var(--crimson);margin-bottom:.5mm}

/* ---------- the Key monogram ---------- */
.key{border-radius:50%;background:var(--crimson);display:inline-flex;align-items:center;justify-content:center;position:relative;flex:none}
.key:after{content:"";position:absolute;inset:7%;border-radius:50%;border:1.6px solid rgba(255,255,255,.9)}
.key span{color:#fff;font-weight:700;letter-spacing:.02em;line-height:1}
.key.ink{background:var(--ink)}
.key.w{background:#fff}.key.w:after{border-color:var(--crimson)}.key.w span{color:var(--crimson)}

/* cover */
.cover .brandrow{display:flex;align-items:center;gap:4mm}
.cover .brand{font-weight:700;color:var(--crimson);font-size:13pt;line-height:1.3}
.cover .doccode{position:absolute;top:24mm;right:21mm;font-family:var(--mono);font-size:9pt;color:var(--ink-50);text-align:right;line-height:1.5}
.cover .title{font-weight:700;font-size:58pt;line-height:1.02;color:var(--ink);margin-top:32mm;letter-spacing:-.01em}
.cover .sub{font-weight:300;font-size:16pt;line-height:1.35;margin-top:7mm;color:var(--ink)}
.cover .prep{font-size:10.5pt;margin-top:12mm}
.cover .people{position:absolute;left:21mm;right:21mm;top:200mm;display:flex;justify-content:space-between}
.cover .people .k{font-size:8.3pt}
.cover .people .v{font-size:15pt;margin-top:1mm}
.cover .people .r{font-size:8.3pt;margin-top:1mm}
.cover .foot,.foot{position:absolute;left:0;right:0;bottom:0;height:22mm;background:var(--crimson);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 14mm;font-size:11pt}

.center-v{display:flex;flex-direction:column;justify-content:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8mm}
.two.wide-l{grid-template-columns:1.3fr 1fr}
.two.wide-r{grid-template-columns:1fr 1.3fr}
.mt1{margin-top:1mm}.mt2{margin-top:2mm}.mt3{margin-top:3mm}.mt4{margin-top:4mm}.mt6{margin-top:6mm}.mt8{margin-top:8mm}.mt10{margin-top:10mm}
.mb0{margin-bottom:0}.mb2{margin-bottom:2mm}.mb4{margin-bottom:4mm}.mb6{margin-bottom:6mm}
.cr{color:var(--crimson)}
.w{color:#fff}
.nowrap{white-space:nowrap}

/* ==================================================================
   SAL-BRD-01 Brand and Identity, Version 1 — document layer.
   Quiet by default: Light headlines in ink, one italic crimson word,
   hairlines and space, square corners, no tints, no icons.
   The Bookmark is only ever the logo. Headings stand alone.
   ================================================================== */
@font-face{font-family:Kufi;font-weight:300;src:url(ds/fonts/UbuntuArabic-Regular.woff2)}
@font-face{font-family:Kufi;font-weight:400;src:url(ds/fonts/UbuntuArabic-Regular.woff2)}
@font-face{font-family:Kufi;font-weight:500;src:url(ds/fonts/UbuntuArabic-Regular.woff2)}
@font-face{font-family:Kufi;font-weight:700;src:url(ds/fonts/UbuntuArabic-Bold.woff2)}
:root{--crimson:#9C213E;--ink:#273236;--paper:#F5F2EE;--stone:#E2DDD6;--ash:#5C6568;--rose:#EBCBD3;
  --crimson-50:transparent;--crimson-100:#EBCBD3;--ink-70:#5C6568;--ink-50:#5C6568;--ink-10:#F5F2EE;--line:#E2DDD6}
body{font-size:10.3pt;line-height:1.55}
.page{padding-top:24mm}
.page.dark,.page.crimson{background:#fff;color:var(--ink)}
.page.dark *,.page.crimson *{color:inherit}
.runner,.runner-l{display:none}
.folio{border-top:1px solid var(--stone);padding-top:2.2mm;color:var(--ash);bottom:10mm}
.folio .code{font-size:7.6pt}
h1.display,.dark h1.display,.crimson h1.display{font-weight:300;color:var(--ink);font-size:40pt;line-height:1.02;letter-spacing:-.025em;margin-bottom:4mm}
h1.display.md{font-size:34pt} h1.display.sm{font-size:28pt} h1.display.xs{font-size:22pt}
h1.display i,.t6 i{font-style:italic;color:var(--crimson);font-weight:300}
.lede,.dark .lede{font-weight:300;color:var(--ink)}
h2,h2.c,.dark h2{font-weight:400;color:var(--ink);letter-spacing:-.01em}
h3,h3.c,.dark h3,.card h3{font-weight:500;color:var(--ink)}
.kicker,.dark .kicker{font-weight:500;color:var(--ash);letter-spacing:.1em}
.kicker:has(+ h1),.kicker:has(+ h2),.kicker:has(+ h3),.kicker:has(+ .display){display:none!important}
.intro,.big-p{font-weight:300}
.small,.dark .small,.xs{color:var(--ash)}
.cr{color:var(--ash)}
hr.rule,.dark hr.rule{border-top:1px solid var(--ink)}
.card,.card.tint,.card.line,.card.grey,.card.cr,.card.ink,.card.dashed{background:transparent!important;color:inherit;border:0;border-top:1px solid var(--ink);border-radius:0;padding:3mm 0 1mm}
.card h3,.card.cr h3{color:var(--ink);font-weight:500;font-size:11.5pt;margin:0 0 1.4mm}
.card p,.card.cr p{color:inherit}
.ic{display:none!important}
.band,.band.ink{background:transparent;color:var(--ink);border-top:1px solid var(--ink);margin:0 21mm;padding:4mm 0 0;left:0;right:0;bottom:24mm}
.band h2{color:var(--ink);font-weight:300;font-size:17pt}
.band p{color:var(--ink)}
.band.flow{margin:7mm 0 0}
.note,.note.ink{background:transparent;border:0;border-top:1px solid var(--stone);border-radius:0;padding:2.5mm 0 0}
.note b,.note.ink b{color:var(--ink)}

<style>html,body{width:1080px;height:1350px;overflow:hidden} /* AUIB Society of Arts and Letters — components.

   Quiet by default: Light headlines in ink, hairlines and space, square corners, no shadows, no tinted cards. */

.sal-ar { font-family: var(--font-arabic); direction: rtl; }

/* ---------- Section head ----------
   A title alone, with an optional link at the end. No marker, no label above it. */
.sal-section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; }
.sal-section-head h2 { margin: 0; font-family: var(--font-sans); font-weight: 300; font-size: 44px; line-height: 1.1; letter-spacing: -0.025em; color: var(--text); }

/* ---------- Buttons ---------- */
.sal-button { display: inline-flex; align-items: center; height: 50px; padding: 0 26px; border: 0; border-radius: 0;
  background: var(--accent); color: var(--on-accent); font: 500 15px var(--font-sans); text-decoration: none; cursor: pointer; }
.sal-link { color: var(--text); font: 500 15px var(--font-sans); text-decoration: none; border-bottom: var(--hairline) solid currentColor; padding-bottom: 2px; }

/* One language per piece: an Arabic page sets dir="rtl" lang="ar" on .sal-page and uses the Arabic lockup. */
.sal-page[dir="rtl"] { font-family: var(--font-arabic); }
.sal-page[dir="rtl"] .sal-cover__title { font-family: var(--font-arabic); font-weight: 400; font-size: 76px; line-height: 1.3; letter-spacing: 0; }

/* ---------- Document page (A4, 794 × 1123 at 96 dpi) ---------- */
.sal-page { position: relative; box-sizing: border-box; width: 794px; height: 1123px; overflow: hidden;
  background: var(--white); color: var(--ink); font-family: var(--font-sans); padding: 0 var(--page-margin); }

/* ---------- Document cover ---------- */
.sal-cover__top { position: absolute; top: 72px; left: var(--page-margin); right: var(--page-margin);
  display: flex; justify-content: space-between; align-items: flex-start; }
.sal-cover__lockup { display: block; height: 78px; width: auto; }
.sal-cover__code { text-align: end; margin-top: 8px; }
.sal-cover__code .sal-code { display: block; font-family: var(--font-mono); font-size: 13px; line-height: 1.4; color: var(--ash); }
.sal-cover__title { position: absolute; top: 320px; left: var(--page-margin); right: var(--page-margin); margin: 0;
  font-size: 88px; line-height: 1; font-weight: 300; letter-spacing: -0.03em; color: var(--ink); }
.sal-cover__subtitle { position: absolute; top: 560px; inset-inline-start: var(--page-margin); max-width: 30ch; margin: 0;
  font-size: 19px; line-height: 1.5; font-weight: 400; color: var(--ink); }
.sal-cover__prepared { position: absolute; bottom: 150px; inset-inline-start: var(--page-margin); margin: 0; font-size: 13px; line-height: 1.6; color: var(--ash); }
.sal-cover__prepared-name { display: block; font-size: 20px; line-height: 1.4; color: var(--ink); }
.sal-cover__foot { position: absolute; left: var(--page-margin); right: var(--page-margin); bottom: 60px;
  border-top: var(--hairline) solid var(--ink); padding-top: 12px; display: flex; justify-content: space-between;
  font: 500 12px var(--font-sans); color: var(--ink); }

/* ---------- Form header ---------- */
.sal-form { background: var(--white); color: var(--ink); font-family: var(--font-sans); }
.sal-form__head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px;
  padding-bottom: 16px; border-bottom: var(--hairline) solid var(--ink); }
.sal-form__code { display: block; font-family: var(--font-mono); font-size: 13px; line-height: 1.3; color: var(--ash); }
.sal-form__title { margin: 6px 0 0; font-size: 32px; line-height: 1.1; font-weight: 300; letter-spacing: -0.02em; color: var(--ink); }
.sal-form__symbol { display: block; height: 44px; width: auto; flex: none; }
.sal-form__fields { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 24px 0; }
.sal-form__field--wide { grid-column: 1 / -1; }
.sal-label { display: block; font-size: 10.4px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ash); }
.sal-writeon { display: block; height: 28px; border-bottom: var(--hairline) solid var(--ink); }
.sal-form__office { display: grid; grid-template-columns: auto 1fr 1fr 1fr; align-items: end; gap: 24px;
  padding: 12px 16px 14px; background: var(--paper); }

.sal-footer { display: flex; justify-content: space-between; align-items: baseline; gap: 24px;

.sal-footer__doc { font-family: var(--font-mono); font-size: 11px; }
.sal-footer__page { font-variant-numeric: tabular-nums; }
.sal-page > .sal-footer { position: absolute; left: var(--page-margin); right: var(--page-margin); bottom: 36px; }

/* ---------- Social: posts, carousels and stories ----------

.sal-post, .sal-story { --u: calc(100cqw / 1080); container-type: inline-size; }
.sal-post__frame, .sal-story__frame { position: relative; width: 100%; aspect-ratio: 4 / 5; overflow: hidden; box-sizing: border-box; font-family: var(--font-sans); }
.sal-story__frame { aspect-ratio: 9 / 16; }
.sal-post__lockup { position: absolute; top: calc(72 * var(--u)); inset-inline-start: calc(80 * var(--u)); height: calc(132 * var(--u)); width: auto; }
.sal-post__headline { position: absolute; inset-inline: calc(80 * var(--u)); top: calc(330 * var(--u)); margin: 0;

.sal-post__lede { position: absolute; inset-inline-start: calc(80 * var(--u)); top: calc(760 * var(--u)); max-width: 24ch; margin: 0;

.sal-post__num { position: absolute; top: calc(220 * var(--u)); font-family: var(--font-sans); inset-inline-start: calc(80 * var(--u)); margin: 0;

.sal-post__title { position: absolute; top: calc(540 * var(--u)); inset-inline: calc(80 * var(--u)); margin: 0;
  font-size: calc(88 * var(--u)); line-height: 1.05; font-weight: 300; letter-spacing: -0.025em; }
.sal-post__body { position: absolute; top: calc(760 * var(--u)); inset-inline-start: calc(80 * var(--u)); max-width: 26ch; margin: 0;
  font-size: calc(38 * var(--u)); line-height: 1.45; }
.sal-post--end .sal-post__frame { display: flex; align-items: center; justify-content: center; }
.sal-post__wordmark { display: block; height: calc(520 * var(--u)); width: auto; }

/* Photo post: the picture above, a solid panel below. Never type over a photograph. */
.sal-post__photo { position: absolute; inset: 0 0 auto 0; width: 100%; height: calc(820 * var(--u)); object-fit: cover; display: block; }

.sal-story .sal-post__lockup { top: calc(250 * var(--u)); }

.sal-story .sal-post__meta { bottom: calc(340 * var(--u)); font-size: calc(34 * var(--u)); }

/* Arabic: Ubuntu Arabic has no Light and no italic. Display is Regular, the accent word is color only. */
[dir="rtl"] .sal-post__frame, [dir="rtl"] .sal-story__frame { font-family: var(--font-arabic); }
