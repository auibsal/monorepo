# ==========================================
# Monorepo Workspace Boundaries
# ==========================================
packages:
  - "apps/*"
  - "packages/*"

# ==========================================
# Global Dependency Dictionary
# ==========================================
catalog:
  # 1. Core Framework (Next.js & React 19)
  next: "16.2.6"
  react: "^19.0.0"
  react-dom: "^19.0.0"
  "@types/react": "^19.0.0"
  "@types/react-dom": "^19.0.0"
  
  # 2. Database & Authentication (Supabase)
  "@supabase/supabase-js": "^2.40.0"
  "@supabase/ssr": "^0.10.3"
  
  # 3. Styling Engine (Tailwind v4 & UI Utilities)
  tailwindcss: "^4.0.0"
  "@tailwindcss/postcss": "^4.0.0"
  clsx: "^2.1.0"
  tailwind-merge: "^2.2.0"
  lucide-react: "^0.360.0"
  
  # 4. Global Tooling & TypeScript Engine
  typescript: "^5.8.2"
  "@types/node": "^24.0.0"
  eslint: "^9.39.4"
  prettier: "^3.3.2"
  framer-motion: "^12.38.0"
