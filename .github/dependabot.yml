# Dependabot is the only updater (decisions.md, The site: the code).
# Security fixes: as soon as GitHub publishes an advisory that touches a
# dependency (Dependabot security updates, turned on in Settings, Code
# security), one grouped pull request per ecosystem, every week at the
# latest. Everything else: monthly, as few pull requests as possible.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      security:
        applies-to: security-updates
        patterns: [ "*" ]
      actions:
        applies-to: version-updates
        patterns: [ "*" ]

  # Bun: one lockfile (bun.lock at the root) serves every workspace, so every
  # update rewrites it, and two update PRs always conflict once either is
  # merged. So there are as few as possible: one PR for every minor and
  # patch update across all workspaces (merged on green CI by
  # dependabot-auto-merge.yml), and one for the majors, which wait for a
  # person. The families (Next, React, Supabase, Storybook, the tooling)
  # still move together, inside them.
  - package-ecosystem: bun
    directories:
      - /
      - /apps/*
      - /packages/*
    schedule:
      interval: monthly
    rebase-strategy: auto
    ignore:
      # Types follow the Node.js runtime (26 LTS, .nvmrc), not the newest Node.
      - dependency-name: "@types/node"
        update-types: [ "version-update:semver-major" ]
    groups:
      security:
        applies-to: security-updates
        patterns: [ "*" ]
      minor-and-patch:
        applies-to: version-updates
        patterns: [ "*" ]
        update-types: [ minor, patch ]
      major:
        applies-to: version-updates
        patterns: [ "*" ]
        update-types: [ major ]
