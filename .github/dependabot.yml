version: 2
updates:
  # Centralized Monorepo Updates
  - package-ecosystem: "pnpm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "18:00"
      timezone: "Asia/Baghdad"
    open-pull-requests-limit: 5
    
    # Grouping strategies to eliminate Pull Request noise
    groups:
      core-framework:
        patterns:
          - "next"
          - "react"
          - "react-dom"
      styling-engine:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      tooling-linters:
        patterns:
          - "eslint"
          - "prettier"
          - "typescript"
          - "turbo"
