name: Scorecard

# OpenSSF Scorecard (decisions.md, The Society: open-source practice): a
# weekly check of the repository's security practices. Results go to
# Security → Code scanning and are published to the Scorecard API, which
# feeds the badge in the README.

on:
  branch_protection_rule:
  push:
    branches: [ main ]
  schedule:
    # 04:20 UTC on Wednesdays is 7:20 AM in Baghdad.
    - cron: "20 4 * * 3"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Upload the results to code scanning.
      security-events: write
      # Publish the results and get the badge (OIDC).
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@f49aabe0b5af0936a0987cfb85d86b75731b0186 # v2.4.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
