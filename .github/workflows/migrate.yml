name: Migrate production database

# Applies new migrations to the production Supabase project once CI has
# passed on main, then deploys the site, so the site never runs ahead of
# its database. Vercel doesn't deploy main by itself
# (apps/web/vercel.json, git.deploymentEnabled); pull requests still get
# their previews. Runs in the protected `production` environment, which
# holds the secrets (Settings → Environments → production):
#   SUPABASE_ACCESS_TOKEN  a personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD   the database password (Project Settings → Database)
#   VERCEL_DEPLOY_HOOK     a Deploy Hook for main (Vercel → the project →
#                          Settings → Git → Deploy Hooks)
#   VERCEL_TOKEN           a read token (vercel.com/account/settings/tokens),
#                          to wait for the hook's build: a build that is
#                          canceled or fails is fired once more, then the run
#                          fails, so production never stays behind unnoticed
#                          (November 15, 2026: #273's hook build was canceled
#                          mid-build and production stayed on #272)
#   CRON_SECRET            the site's own (as on Vercel): a failed run posts
#                          an urgent alert to the Diwan group's web topic and
#                          the Desk (scripts/alert-workflow.sh)
# `supabase db push` applies only migrations not yet recorded in
# supabase_migrations.schema_migrations, in order, and stops at the first error.
# CI refuses a pull request whose new migration is older than the newest on
# main, so migrations always arrive in order and no `--include-all` is
# needed. A manual run is allowed from main only.
#
# CI calls this workflow as its last job on a push to main, once every check
# has passed (ci.yml, `migrate`), so it runs on the commit CI tested. It
# used to follow CI by `workflow_run` and check out that run's commit, which
# OpenSSF Scorecard counts as a dangerous workflow (Dangerous-Workflow).

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    name: supabase db push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT: ${{ vars.VERCEL_PROJECT_ID || 'prj_fifF034f0SEYMfSsJ9z9dptsASuZ' }}
      VERCEL_TEAM: ${{ vars.VERCEL_TEAM_ID || 'team_ckfxakArLHH4wueW2NBDz82p' }}
      SHA: ${{ github.sha }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'fghzahtzgelqnpwdhwjo' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "Add SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and VERCEL_DEPLOY_HOOK to the production environment."
            exit 1
          fi
      - name: Link the project
        working-directory: packages/database
        # The password comes from SUPABASE_DB_PASSWORD (CLI 3 ignores link --password).
        run: bunx supabase link --project-ref "$PROJECT_REF"
      - name: Pending migrations
        working-directory: packages/database
        run: bunx supabase migration list --password "$SUPABASE_DB_PASSWORD" --remote
      - name: Apply
        id: apply
        working-directory: packages/database
        # A hosted change: CLI 3 asks first, and --yes is the answer in CI.
        run: bunx supabase db push --yes --password "$SUPABASE_DB_PASSWORD" --remote
      # Only now, with the database caught up, does main go live.
      - name: Deploy the site
        timeout-minutes: 25
        run: bash scripts/deploy-production.sh
      # A failed migration or deploy is never silent (decisions.md, The site).
      - name: Tell the Diwan
        if: failure()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WHICH: ${{ steps.apply.outcome == 'success' && 'deploy' || 'migrate' }}
        run: bash scripts/alert-workflow.sh "$WHICH"
