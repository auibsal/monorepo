name: Migrate production database

# Applies new migrations to the production Supabase project once CI has
# passed on main. The site is deployed by Vercel itself from main (owner,
# Nov 4, 2026: no deploy hook is needed); a Deploy Hook, if one is set,
# is still called after the migrations. Runs in the protected `production`
# environment, which holds the secrets (Settings → Environments → production):
#   SUPABASE_ACCESS_TOKEN  a personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD   the database password (Project Settings → Database)
#   VERCEL_DEPLOY_HOOK     optional: a Deploy Hook for main (Vercel → the
#                          project → Settings → Git → Deploy Hooks)
# `supabase db push` applies only migrations not yet recorded in
# supabase_migrations.schema_migrations, in order, and stops at the first error.
# CI refuses a pull request whose new migration is older than the newest on
# main, so migrations always arrive in order and no `--include-all` is
# needed. A manual run is allowed from main only.

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: migrate-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    name: supabase db push
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'fghzahtzgelqnpwdhwjo' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD to the production environment."
            exit 1
          fi
      - name: Link the project
        working-directory: packages/database
        run: bunx supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Pending migrations
        working-directory: packages/database
        run: bunx supabase migration list --password "$SUPABASE_DB_PASSWORD"
      - name: Apply
        working-directory: packages/database
        run: bunx supabase db push --password "$SUPABASE_DB_PASSWORD"
      # Vercel deploys main on its own; a Deploy Hook, when one is set,
      # deploys again now that the database has caught up.
      - name: Deploy the site
        if: env.VERCEL_DEPLOY_HOOK != ''
        run: curl -fsS --retry 3 -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null
