name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# 🚀 Enterprise Optimization: Cancel stale runs to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Lint & Typecheck
    runs-on: ubuntu-latest
    
    # 🛡️ Build-Time Environment Dummy Variables
    # Next.js will crash during the build step if these are missing
    env:
      NEXT_PUBLIC_WEB_URL: "http://localhost:3000"
      NEXT_PUBLIC_NEXUS_URL: "http://localhost:3001"
      NEXT_PUBLIC_SUPABASE_URL: "https://ci-dummy-project.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-dummy-key"
      POSTGRES_URL: "postgresql://postgres:postgres@localhost:5432/ci-dummy"
      RESEND_API_KEY: "re_dummy_key"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v4
          
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ github.ref_name }}-
            turbo-${{ github.job }}-
          
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Verify Formatting
        run: pnpm prettier --check "**/*.{ts,tsx,md,json,mjs,css}"
        
      - name: Run Linters & Typecheck
        run: pnpm turbo run lint typecheck
        
      - name: Build Applications
        run: pnpm turbo run build
