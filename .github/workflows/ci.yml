name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces its run; every run on main
  # finishes, because the migration and the deployment follow it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Integrations are optional at build time; real keys live in Vercel.
  SKIP_ENV_VALIDATION: "true"
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  TURBO_TELEMETRY_DISABLED: "1"
  # Vercel Remote Cache: unchanged packages are not rebuilt or re-tested.
  # Inactive until TURBO_TOKEN (secret) and TURBO_TEAM (variable) are set.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # New or updated packages with known vulnerabilities fail the PR (the
  # dependency graph is on by default for a public repository).
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # GitHub builds a squash merge's message from every commit in the pull
      # request, and skips every workflow on main when that message carries
      # one of its skip markers: no CI, no migration, no deployment (it
      # happened twice on October 23, 2026). So no commit in a pull request
      # may contain one, not even to describe it.
      - name: Commit messages carry no workflow skip marker
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if gh api "repos/${{ github.repository }}/pulls/$PR/commits" --paginate --jq '.[].commit.message' \
            | grep -Eiq '\[(skip ci|ci skip|no ci|skip actions|actions skip)\]'; then
            echo "A commit message in this pull request contains a workflow skip marker. Reword it (git rebase) before merging."
            exit 1
          fi
      # Production applies migrations in order (no --include-all), so a new
      # migration must be newer than every migration already on main.
      - name: New migrations come after main's
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --depth=1 origin "$BASE"
          dir=packages/database/supabase/migrations
          newest=$(git ls-tree --name-only "origin/$BASE" "$dir/" | xargs -n1 basename | sort | tail -1)
          late=0
          for f in $(ls "$dir"); do
            if ! git cat-file -e "origin/$BASE:$dir/$f" 2>/dev/null && [[ "$f" < "$newest" ]]; then
              echo "$f is older than $newest on $BASE: give it a later timestamp."
              late=1
            fi
          done
          exit $late
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Known vulnerabilities in the lockfile (high or critical) fail the build.
      - run: bun audit --audit-level=high
      - run: bun run check
      - run: bunx turbo boundaries
      - run: bun run typecheck
      - run: bun run test:coverage
      - run: bun run check:placeholders
      - run: bun run check:rtl
      - run: bun run check:i18n
      - run: bun run check:unused
      - run: bun run --cwd packages/brand tokens --check
      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-report-typescript
          path: coverage/cobertura-coverage.xml

  upload-coverage-typescript:
    name: Upload coverage (TypeScript)
    needs: checks
    if: ${{ !cancelled() && needs.checks.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report-typescript
      - uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: cobertura-coverage.xml
          language: TypeScript
          label: code-coverage-agent

  build:
    name: Build apps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Bun installs and runs scripts; Next.js itself runs on Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bunx turbo build --filter=web
      # No secret may reach a browser bundle: the client chunks must not
      # contain the secret-key prefix or the server-only names. The directory
      # must exist, or the check is not checking anything.
      - name: No secrets in the client bundle
        run: |
          set -e
          test -d apps/web/.next/static || { echo "Missing apps/web/.next/static"; exit 1; }
          if grep -rqE "sb_secret_[A-Za-z0-9_-]{8,}|SUPABASE_SECRET_KEY|RESEND_TOKEN|CRON_SECRET|REVALIDATE_SECRET|DATABASE_WEBHOOK_SECRET|TELEGRAM_BOT_TOKEN|VAPID_PRIVATE_KEY|GOOGLE_WALLET_PRIVATE_KEY|TURNSTILE_SECRET_KEY|RESEND_WEBHOOK_SECRET|sk_(dev|prod)_[A-Za-z0-9_-]{8,}" apps/web/.next/static; then
            echo "A secret name or value reached a client bundle."
            exit 1
          fi

  database:
    name: Database (migrations, RLS, integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Start Supabase (applies migrations and seed)
        working-directory: packages/database
        run: bunx supabase start -x studio,imgproxy,mailpit,logflare,vector,supavisor,edge-runtime,realtime,postgres-meta
      - name: Lint schema
        working-directory: packages/database
        run: bunx supabase db lint --level warning --fail-on warning
      - name: pgTAP preamble is in sync
        working-directory: packages/database
        run: bun scripts/sync-test-preamble.ts --check
      - name: Row Level Security tests (pgTAP)
        working-directory: packages/database
        run: bunx supabase test db
      - name: Generated types are up to date
        run: |
          (cd packages/database && bunx supabase gen types typescript --local --schema public,core,access,membership,events,journal,programmes,governance,content) \
            | bunx biome format --stdin-file-path=packages/database/types.ts > "$RUNNER_TEMP/types.ts"
          diff -u packages/database/types.ts "$RUNNER_TEMP/types.ts" \
            || (echo "Run 'bun run db:types' and commit the result." && exit 1)
      # The site's forms against the register in SAL-EXB-01 (owner, Nov 7,
      # 2026): codes, titles, where each is filled and its fields. Reads
      # Notion with the NOTION_TOKEN repository secret.
      - name: Forms match the register in Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          # On main a missing token fails; on a pull request (a fork has no
          # secrets) it is skipped.
          REQUIRE_FORMS_REGISTER: ${{ github.ref == 'refs/heads/main' && '1' || '' }}
        run: |
          eval "$(cd packages/database && bunx supabase status -o env | grep -E '^(API_URL|SECRET_KEY)=' | sed 's/^/export /')"
          export SUPABASE_URL="$API_URL" SUPABASE_SECRET_KEY="$SECRET_KEY"
          bun scripts/check-forms-register.ts
      - name: Integration tests (auth, storage, data, Notion sync)
        run: |
          eval "$(cd packages/database && bunx supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY)=' | sed 's/^/export /')"
          SUPABASE_INTEGRATION=1 bunx turbo test --force --filter=@repo/auth --filter=@repo/storage --filter=@repo/sal-data --filter=web

  e2e:
    name: End-to-end (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - name: Start Supabase (with Mailpit for confirmation emails and Realtime for co-editing)
        working-directory: packages/database
        run: bunx supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime,postgres-meta
      - name: Browsers
        working-directory: apps/e2e
        run: bunx playwright install --with-deps chromium
      # The journeys run against production builds (next start), not the dev
      # server: faster, and what actually ships. Their data is seeded first:
      # the build caches what it reads (What's on's current month, for one),
      # and seeded rows bypass the publish path that would revalidate it.
      - name: Seed the journeys' data
        run: |
          eval "$(cd packages/database && bunx supabase status -o env | grep -E '^(API_URL|SECRET_KEY)=' | sed 's/^/export /')"
          export SUPABASE_URL="$API_URL" SUPABASE_SECRET_KEY="$SECRET_KEY"
          bun run --cwd apps/e2e seed
      - name: Build the app against the local stack
        run: |
          eval "$(cd packages/database && bunx supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY)=' | sed 's/^/export /')"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY"
          bunx turbo build --filter=web
      - name: Journeys (sign up, sign in, book, submit, publish, co-edit) and axe checks
        run: |
          eval "$(cd packages/database && bunx supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY|MAILPIT_URL|INBUCKET_URL)=' | sed 's/^/export /')"
          export SUPABASE_URL="$API_URL" SUPABASE_SECRET_KEY="$SECRET_KEY"
          export MAILPIT_URL="${MAILPIT_URL:-$INBUCKET_URL}"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY"
          E2E_START=start bun run --cwd apps/e2e e2e
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: playwright-traces
          path: apps/e2e/test-results
          retention-days: 7
