name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Integrations are optional at build time; real keys live in Vercel.
  SKIP_ENV_VALIDATION: "true"
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  TURBO_TELEMETRY_DISABLED: "1"
  # Vercel Remote Cache: unchanged packages are not rebuilt or re-tested.
  # Inactive until TURBO_TOKEN (secret) and TURBO_TEAM (variable) are set.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # New or updated packages with known vulnerabilities fail the PR (the
  # dependency graph is on by default for a public repository).
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      # GitHub builds a squash merge's message from every commit in the pull
      # request, and skips every workflow on main when that message carries
      # one of its skip markers: no CI, no migration, no deployment (it
      # happened twice on October 23, 2026). So no commit in a pull request
      # may contain one, not even to describe it.
      - name: Commit messages carry no workflow skip marker
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if gh api "repos/${{ github.repository }}/pulls/$PR/commits" --paginate --jq '.[].commit.message' \
            | grep -Eiq '\[(skip ci|ci skip|no ci|skip actions|actions skip)\]'; then
            echo "A commit message in this pull request contains a workflow skip marker. Reword it (git rebase) before merging."
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Known vulnerabilities in the lockfile (high or critical) fail the build.
      - run: bun audit --audit-level=high
      - run: bun run check
      - run: bunx turbo boundaries
      - run: bun run typecheck
      - run: bun run test:coverage
      - run: bun run check:placeholders
      - run: bun run check:rtl
      - run: bun run check:i18n
      - run: bun run check:unused
      - run: bun run --cwd packages/design-system tokens --check
      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report-typescript
          path: coverage/cobertura-coverage.xml

  upload-coverage-typescript:
    name: Upload coverage (TypeScript)
    needs: checks
    if: ${{ !cancelled() && needs.checks.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-typescript
      - uses: actions/upload-code-coverage@v1
        with:
          file: cobertura-coverage.xml
          language: TypeScript
          label: code-coverage-agent

  build:
    name: Build apps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Bun installs and runs scripts; Next.js itself runs on Node.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bunx turbo build --filter=web --filter=@repo/storybook
      # No secret may reach a browser bundle: the client chunks must not
      # contain the secret-key prefix or the server-only names. The directory
      # must exist, or the check is not checking anything.
      - name: No secrets in the client bundle
        run: |
          set -e
          test -d apps/web/.next/static || { echo "Missing apps/web/.next/static"; exit 1; }
          if grep -rqE "sb_secret_[A-Za-z0-9_-]{8,}|SUPABASE_SECRET_KEY|RESEND_TOKEN|CRON_SECRET|REVALIDATE_SECRET|DATABASE_WEBHOOK_SECRET|TELEGRAM_BOT_TOKEN|VAPID_PRIVATE_KEY|sk_(dev|prod)_[A-Za-z0-9_-]{8,}" apps/web/.next/static; then
            echo "A secret name or value reached a client bundle."
            exit 1
          fi

  database:
    name: Database (migrations, RLS, integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Start Supabase (applies migrations and seed)
        working-directory: packages/database
        run: bunx supabase start -x studio,imgproxy,mailpit,logflare,vector,supavisor,edge-runtime,realtime,postgres-meta
      - name: Lint schema
        working-directory: packages/database
        run: bunx supabase db lint --level warning --fail-on warning
      - name: pgTAP preamble is in sync
        working-directory: packages/database
        run: bun scripts/sync-test-preamble.ts --check
      - name: Row Level Security tests (pgTAP)
        working-directory: packages/database
        run: bunx supabase test db
      - name: Generated types are up to date
        run: |
          (cd packages/database && bunx supabase gen types typescript --local --schema public,core,access,membership,events,journal,charity,programmes,governance,content) \
            | bunx biome format --stdin-file-path=packages/database/types.ts > "$RUNNER_TEMP/types.ts"
          diff -u packages/database/types.ts "$RUNNER_TEMP/types.ts" \
            || (echo "Run 'bun run db:types' and commit the result." && exit 1)
      - name: Integration tests (auth, storage, data, Notion sync)
        run: |
          eval "$(cd packages/database && bunx supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY)=' | sed 's/^/export /')"
          SUPABASE_INTEGRATION=1 bunx turbo test --force --filter=@repo/auth --filter=@repo/storage --filter=@repo/sal-data --filter=web

  e2e:
    name: End-to-end (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - name: Start Supabase (with Mailpit for confirmation emails and Realtime for co-editing)
        working-directory: packages/database
        run: bunx supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime,postgres-meta
      - name: Browsers
        working-directory: apps/e2e
        run: bunx playwright install --with-deps chromium
      # The journeys run against production builds (next start), not the dev
      # server: faster, and what actually ships.
      - name: Build the app against the local stack
        run: |
          eval "$(cd packages/database && bunx supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY)=' | sed 's/^/export /')"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY"
          bunx turbo build --filter=web
      - name: Journeys (sign up, sign in, book, submit, publish, co-edit) and axe checks
        run: |
          eval "$(cd packages/database && bunx supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY|MAILPIT_URL|INBUCKET_URL)=' | sed 's/^/export /')"
          export SUPABASE_URL="$API_URL" SUPABASE_SECRET_KEY="$SECRET_KEY"
          export MAILPIT_URL="${MAILPIT_URL:-$INBUCKET_URL}"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY"
          E2E_START=start E2E_COLLAB=1 bun run --cwd apps/e2e e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-traces
          path: apps/e2e/test-results
          retention-days: 7
