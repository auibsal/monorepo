name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# 🚀 Enterprise Optimization: Cancel stale runs to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Lint, Typecheck & Test
    runs-on: ubuntu-latest
    
    # 🛡️ Build-Time Environment Dummy Variables
    # Next.js will crash during the build step if these are missing
    env:
      NEXT_PUBLIC_WEB_URL: "http://localhost:3000"
      NEXT_PUBLIC_NEXUS_URL: "http://localhost:3001"
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-dummy-key"
      POSTGRES_PRISMA_URL: "postgresql://postgres:postgres@127.0.0.1:54322/ci-dummy"
      POSTGRES_URL_NON_POOLING: "postgresql://postgres:postgres@127.0.0.1:5432/ci-dummy"
      POSTGRES_URL: "postgresql://postgres:postgres@127.0.0.1:5432/ci-dummy"
      RESEND_API_KEY: "re_dummy_key"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v4
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Reads directly from the universal file we established
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-${{ github.ref_name }}-
            turbo-${{ github.job }}-
          
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        
      # 🚨 INJECTED STEP: Validates all commit messages in the Pull Request
      - name: Enforce Commit Format
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
        
      - name: Verify Formatting
        run: pnpm run format:check
        
      - name: Run Linters & Typecheck
        run: pnpm turbo run lint typecheck
        
      - name: Build Applications
        run: pnpm turbo run build
        
      - name: Run End-to-End Tests
        run: pnpm turbo run test
