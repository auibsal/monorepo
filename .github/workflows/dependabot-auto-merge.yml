name: Dependabot auto-merge

# Dependabot's minor and patch updates, and its security updates that are
# not majors, merge themselves once every required check on main has
# passed (GitHub's auto-merge, squash). A major waits for a person.
# Nothing here bypasses CI: auto-merge only queues the merge.
# Needs Settings → General → "Allow auto-merge".

on:
  pull_request:

permissions:
  contents: read

jobs:
  auto-merge:
    name: Queue the merge
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'auibsal/monorepo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read the update
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Merge when CI passes
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
